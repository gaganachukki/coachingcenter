<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0; width: 100%; min-height: 100vh; position: relative; background-color: var(--bg-main, #ffffff); overflow-x: hidden;">

    <!-- We'll keep the preloader just in case JS expects it -->
    <div id="preloader">
        <div class="preloader-brand" style="margin-bottom: 16px;"><img src="assets/logo.webp" alt="STACKLY Logo" style="height: 80px; width: auto; object-fit: contain;"></div>
        <div class="preloader-text">Learn • Grow • Achieve</div>
    </div>

    <!-- The 404 Container -->
    <div class="error-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 600px; min-height: 100vh; z-index: 10; margin: 0 auto; padding: 40px 24px; box-sizing: border-box;">
        <div class="glitch-wrapper" style="position: relative; display: inline-block;">
            <h1 class="glitch-text" data-text="404" style="font-size: 12rem; font-weight: 900; color: var(--primary, #008f72); line-height: 1; margin-bottom: 0;">404</h1>
        </div>
        <h2 class="fade-in-up" style="font-size: 2.5rem; margin-bottom: 16px; color: var(--text-main, #121212);">Page Not Found</h2>
        <p class="fade-in-up" style="animation-delay: 0.2s; margin-bottom: 40px; color: var(--text-gray, #64748b); font-size: 1.1rem; max-width: 400px; margin-left: auto; margin-right: auto;">
            Looks like this learning path doesn't exist. Let's get you back on track.
        </p>
        
        <div class="fade-in-up" style="animation-delay: 0.4s; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
            <button onclick="history.back()" class="btn btn-outline" style="padding: 12px 32px; border-radius: 30px; font-weight: 600;">Go Back</button>
            <a href="index.html" class="btn btn-primary" style="padding: 12px 32px; border-radius: 30px; font-weight: 600; text-decoration: none;">Return Home</a>
        </div>
    </div>

    <!-- Floating Background Elements for Animation -->
    <div class="floating-shapes" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0;">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <style>
        
        /* Mobile overrides for 404 */
        @media (max-width: 480px) {
            .glitch-text { 
                font-size: 6rem !important; 
                animation: none !important; 
            }
            .glitch-text::before, 
            .glitch-text::after { 
                display: none !important; 
            }
            h2.fade-in-up { font-size: 1.5rem !important; }
            .error-container { 
                min-height: 100vh;
                padding: 24px 16px !important;
            }
            .btn { width: 100%; justify-content: center; text-align: center; }
        }

        /* Fade In Up Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 404 Glitch Animation */
        .glitch-text {
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            left: 4px;
            text-shadow: -2px 0 #ef4444;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -4px;
            text-shadow: -2px 0 #3b82f6;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); transform: skew(0.8deg); }
            5% { clip: rect(70px, 9999px, 71px, 0); transform: skew(0.5deg); }
            10% { clip: rect(29px, 9999px, 83px, 0); transform: skew(0.3deg); }
            15% { clip: rect(85px, 9999px, 14px, 0); transform: skew(0.8deg); }
            20% { clip: rect(32px, 9999px, 21px, 0); transform: skew(0.6deg); }
            25% { clip: rect(61px, 9999px, 41px, 0); transform: skew(0.3deg); }
            30% { clip: rect(9px, 9999px, 66px, 0); transform: skew(0.5deg); }
            35% { clip: rect(46px, 9999px, 95px, 0); transform: skew(0.2deg); }
            40% { clip: rect(10px, 9999px, 77px, 0); transform: skew(0.8deg); }
            45% { clip: rect(3px, 9999px, 23px, 0); transform: skew(0.4deg); }
            50% { clip: rect(82px, 9999px, 13px, 0); transform: skew(0.9deg); }
            55% { clip: rect(64px, 9999px, 94px, 0); transform: skew(0.2deg); }
            60% { clip: rect(98px, 9999px, 59px, 0); transform: skew(0.1deg); }
            65% { clip: rect(70px, 9999px, 32px, 0); transform: skew(0.8deg); }
            70% { clip: rect(27px, 9999px, 81px, 0); transform: skew(0.4deg); }
            75% { clip: rect(38px, 9999px, 61px, 0); transform: skew(0.3deg); }
            80% { clip: rect(42px, 9999px, 25px, 0); transform: skew(0.7deg); }
            85% { clip: rect(54px, 9999px, 49px, 0); transform: skew(0.9deg); }
            90% { clip: rect(89px, 9999px, 6px, 0); transform: skew(0.5deg); }
            95% { clip: rect(23px, 9999px, 38px, 0); transform: skew(0.8deg); }
            100% { clip: rect(93px, 9999px, 91px, 0); transform: skew(0.1deg); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(0.4deg); }
            5% { clip: rect(52px, 9999px, 74px, 0); transform: skew(0.1deg); }
            10% { clip: rect(79px, 9999px, 85px, 0); transform: skew(0.8deg); }
            15% { clip: rect(75px, 9999px, 5px, 0); transform: skew(0.4deg); }
            20% { clip: rect(34px, 9999px, 14px, 0); transform: skew(0.2deg); }
            25% { clip: rect(65px, 9999px, 86px, 0); transform: skew(0.9deg); }
            30% { clip: rect(48px, 9999px, 31px, 0); transform: skew(0.5deg); }
            35% { clip: rect(14px, 9999px, 53px, 0); transform: skew(0.1deg); }
            40% { clip: rect(84px, 9999px, 98px, 0); transform: skew(0.4deg); }
            45% { clip: rect(5px, 9999px, 2px, 0); transform: skew(0.8deg); }
            50% { clip: rect(68px, 9999px, 43px, 0); transform: skew(0.2deg); }
            55% { clip: rect(31px, 9999px, 87px, 0); transform: skew(0.7deg); }
            60% { clip: rect(90px, 9999px, 11px, 0); transform: skew(0.3deg); }
            65% { clip: rect(7px, 9999px, 52px, 0); transform: skew(0.6deg); }
            70% { clip: rect(43px, 9999px, 95px, 0); transform: skew(0.9deg); }
            75% { clip: rect(21px, 9999px, 36px, 0); transform: skew(0.4deg); }
            80% { clip: rect(81px, 9999px, 68px, 0); transform: skew(0.1deg); }
            85% { clip: rect(12px, 9999px, 79px, 0); transform: skew(0.5deg); }
            90% { clip: rect(95px, 9999px, 24px, 0); transform: skew(0.8deg); }
            95% { clip: rect(58px, 9999px, 41px, 0); transform: skew(0.2deg); }
            100% { clip: rect(29px, 9999px, 9px, 0); transform: skew(0.6deg); }
        }
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            10% { transform: skew(-2deg); }
            20% { transform: skew(1deg); }
            30% { transform: skew(-1deg); }
            40% { transform: skew(3deg); }
            50% { transform: skew(-3deg); }
            60% { transform: skew(2deg); }
            70% { transform: skew(-1deg); }
            80% { transform: skew(1deg); }
            90% { transform: skew(-2deg); }
            100% { transform: skew(0deg); }
        }

        /* Floating Background Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--primary, #008f72);
            filter: blur(80px);
            opacity: 0.15;
            z-index: 1;
            animation: float 10s infinite ease-in-out alternate;
        }
        .shape-1 {
            width: 300px; height: 300px;
            top: -100px; left: -100px;
        }
        .shape-2 {
            width: 400px; height: 400px;
            bottom: -150px; right: -100px;
            animation-delay: -5s;
        }
        .shape-3 {
            width: 200px; height: 200px;
            top: 40%; left: 50%;
            animation-duration: 15s;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }
    </style>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
