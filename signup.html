<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div id="preloader">
        <div class="preloader-brand" style="margin-bottom: 16px;"><img src="assets/logo.webp" alt="STACKLY Logo" style="height: 80px; width: auto; object-fit: contain;"></div>
        <div class="preloader-text">Learn • Grow • Achieve</div>
    </div>

    <a href="index.html" class="auth-back">&larr; Back to Home</a>
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-brand">STACKLY</span>
            <h2 class="auth-title">Create Your Account</h2>
            <p class="auth-subtitle">Start your learning journey today.</p>
        </div>
        <form id="signupForm" novalidate>
            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="student" onclick="selectRole('student', this)">Student</button>
                <button type="button" class="role-btn" data-role="admin" onclick="selectRole('admin', this)">Admin</button>
            </div>
            <input type="hidden" id="selectedRole" value="student">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="signupName" class="form-control" required placeholder="John Doe" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" required placeholder="Min 6 characters" minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" required placeholder="Confirm password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Signup</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>

<script>
(function() {
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');
    const overlay = document.getElementById('menuOverlay');
    if (hamburger && navMenu && overlay) {
        hamburger.addEventListener('click', function() {
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', function() {
            navMenu.classList.remove('active');
            overlay.classList.remove('active');
            const lines = hamburger.querySelectorAll('.hamburger-line');
            lines[0].style.transform = 'none';
            lines[1].style.opacity = '1';
            lines[2].style.transform = 'none';
        });
    }

    // Role Selection Logic
    window.selectRole = function(role, btnElement) {
        document.getElementById('selectedRole').value = role;
        var btns = document.querySelectorAll('.role-btn');
        btns.forEach(function(btn) {
            btn.classList.remove('active');
        });
        btnElement.classList.add('active');
    };
})();
</script>

</body>
</html>
