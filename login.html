<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div id="preloader">
        <div class="preloader-brand" style="margin-bottom: 16px;"><img src="assets/logo.webp" alt="STACKLY Logo" style="height: 80px; width: auto; object-fit: contain;"></div>
        <div class="preloader-text">Learn • Grow • Achieve</div>
    </div>

    <a href="index.html" class="auth-back">&larr; Back to Home</a>
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-brand">STACKLY</span>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Continue your learning journey.</p>
        </div>
        <div id="loginFormBox">
            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="student" onclick="selectRole('student', this)">Student</button>
                <button type="button" class="role-btn" data-role="admin" onclick="selectRole('admin', this)">Admin</button>
            </div>
            <input type="hidden" id="selectedRole" value="student">
            <div class="form-group">
                <label class="form-label">Email / User ID</label>
                <input type="text" id="emailInput" class="form-control" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" required placeholder="Enter password" minlength="6">
            </div>
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="404.html" style="color: var(--primary);">Forgot Password?</a>
            </div>
            <button type="button" class="btn btn-primary auth-submit" onclick="executeLogin()">Login</button>
        </div>
        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

<script>

    function selectRole(role, btnElement) {
        document.getElementById('selectedRole').value = role;
        var btns = document.querySelectorAll('.role-btn');
        btns.forEach(function(btn) {
            btn.classList.remove('active');
        });
        btnElement.classList.add('active');
    }


    function executeLogin() {
        var roleInput = document.getElementById('selectedRole');
        var role = roleInput ? roleInput.value : 'student';
        
        var emailInput = document.getElementById('emailInput');
        var email = emailInput ? emailInput.value : 'student@gmail.com';
        if(email.trim() === '') email = 'student@gmail.com';
        
        localStorage.setItem('currentUserEmail', email);
        
        if (role === 'admin') {
            window.location.href = 'admindashboard.html';
        } else {
            window.location.href = 'userdashboard.html';
        }
    }
</script>

</body>
</html>
